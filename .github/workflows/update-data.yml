name: Aktualizuj dane Monitora Bańki AI

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas

      - name: Uruchom monitor
        run: |
          mkdir -p monitor_data
          python ai_bubble_monitor.py

      - name: Zapisz dane do repozytorium
        run: |
          git config user.name "Monitor Bańki AI"
          git config user.email "monitor@users.noreply.github.com"
          git add monitor_data/latest_report.json
          if git diff --staged --quiet; then
            echo "Brak zmian w danych"
          else
            git commit -m "Automatyczna aktualizacja danych $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
